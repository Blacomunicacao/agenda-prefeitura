<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Agenda - Prefeitura de Presidente Prudente</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/pt-br.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#1a2a3a;overflow-x:hidden}

/* ── Login ── */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#004d99,#003366);padding:16px}
.login-card{background:#fff;border-radius:24px;padding:36px 28px;width:100%;max-width:440px;box-shadow:0 20px 40px rgba(0,0,0,.2);text-align:center}
.login-logo{max-width:200px;height:auto;margin-bottom:16px}
.sidebar-logo{max-width:130px;height:auto;margin-bottom:8px}
.login-card h1{font-size:22px;color:#003366;margin-bottom:4px}
.login-card p{color:#666;font-size:14px;margin-bottom:24px}
.form-group{margin-bottom:16px;text-align:left}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#333}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:10px;font-family:inherit;font-size:14px;outline:none;transition:border .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#004d99}
.form-group textarea{resize:vertical;min-height:80px}
.btn-primary{width:100%;padding:13px;background:#004d99;color:#fff;border:none;border-radius:40px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-primary:hover{background:#003366}
.erro{background:#f8d7da;color:#721c24;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.sucesso{background:#d4edda;color:#155724;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.login-links{margin-top:18px;display:flex;justify-content:center;gap:24px;font-size:13px}
.login-links a{color:#004d99;text-decoration:none;font-weight:500}
.login-links a:hover{text-decoration:underline}

/* ── Layout ── */
.app{display:flex;min-height:100vh}
.sidebar{width:270px;background:#003366;color:#fff;position:fixed;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s}
.sidebar.pref-sidebar{background:#7b0000}
.sidebar-header{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.15);text-align:center}
.sidebar-header h3{font-size:16px;margin-bottom:6px}
.orgao-badge{display:inline-block;background:#ff9900;color:#003366;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.orgao-badge.pref-badge{background:#ff4444;color:#fff}
.sidebar-nav{padding:12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:rgba(255,255,255,.8);cursor:pointer;margin-bottom:4px;font-size:14px;transition:all .2s}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.15);color:#fff}
.sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.15);font-size:12px;color:rgba(255,255,255,.7)}
.btn-logout{width:100%;margin-top:10px;padding:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;cursor:pointer;font-size:13px}
.btn-logout:hover{background:rgba(255,255,255,.2)}

.main{flex:1;margin-left:270px;width:calc(100% - 270px);padding:20px;max-width:100%;overflow-x:hidden}
.view{display:none;animation:fadeIn .25s}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── Cards stat ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{background:#fff;border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:all .2s}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.stat-icon{font-size:36px}
.stat-info h3{font-size:26px;color:#003366}
.stat-info p{font-size:13px;color:#666}

/* ── Seção ── */
.secao{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px}
.secao-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.secao-header h2{font-size:18px;color:#003366}

/* ── Botões ── */
.btn{padding:9px 18px;border:none;border-radius:30px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-azul{background:#004d99;color:#fff}.btn-azul:hover{background:#003a73}
.btn-verde{background:#28a745;color:#fff}.btn-verde:hover{background:#218838}
.btn-vermelho{background:#dc3545;color:#fff}.btn-vermelho:hover{background:#b02a37}
.btn-cinza{background:#6c757d;color:#fff}.btn-cinza:hover{background:#545b62}
.btn-amarelo{background:#ffc107;color:#212529}.btn-amarelo:hover{background:#e0a800}
.btn-outline{background:transparent;border:1px solid #004d99;color:#004d99}.btn-outline:hover{background:#004d99;color:#fff}
.btn-pdf{background:#dc3545;color:#fff}.btn-pdf:hover{background:#b02a37}
.btns-row{display:flex;gap:10px;flex-wrap:wrap}

/* ── Eventos lista ── */
.evento-card{background:#fff;border-radius:14px;padding:18px;border-left:5px solid #004d99;box-shadow:0 2px 6px rgba(0,0,0,.06);cursor:pointer;transition:all .2s;margin-bottom:12px}
.evento-card:hover{transform:translateX(4px)}
.evento-card.prefeito{border-left-color:#dc3545;background:#fff8f8}
.evento-titulo{font-size:16px;font-weight:700;color:#003366;margin-bottom:10px}
.evento-card.prefeito .evento-titulo{color:#dc3545}
.evento-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:#555}
.evento-meta span{display:flex;align-items:center;gap:4px}
.tag-prefeito{background:#dc3545;color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;margin-left:8px}
.tag-orgao{background:#e8f0fe;color:#003366;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}

/* ── Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:16px}
.modal-bg.aberto{display:flex}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:680px;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column}
.modal-head{padding:18px 22px;background:#003366;color:#fff;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1}
.modal-head.prefeito-head{background:#dc3545}
.modal-head h3{font-size:17px}
.modal-close{font-size:26px;cursor:pointer;line-height:1;background:none;border:none;color:#fff}
.modal-body{padding:22px;flex:1}
.modal-footer{padding:14px 22px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.info-linha{display:flex;padding:9px 0;border-bottom:1px solid #f5f5f5}
.info-label{font-weight:700;color:#003366;width:120px;flex-shrink:0;font-size:14px}
.info-valor{flex:1;color:#333;font-size:14px;word-break:break-word}

/* ── Calendário ── */
.fc-event{cursor:pointer!important;font-size:12px!important;padding:4px 6px!important;border-radius:6px!important;white-space:normal!important;word-break:break-word!important;display:block!important}
.fc-event .fc-event-time{display:none!important}
.prefeito-event{background:#dc3545!important;border-color:#b02a37!important;color:#fff!important}
.prefeito-event-mobile{background:#dc3545!important;border-color:#b02a37!important;color:#fff!important}
.fc-view-harness{height:calc(100vh - 200px)!important;min-height:500px}
.fc-toolbar-title{font-size:18px!important}
.fc-button{padding:6px 12px!important;font-size:14px!important}
.fc-col-header-cell-cushion{font-size:14px!important;font-weight:600!important}
.fc-daygrid-day-number{font-size:14px}

/* ── Tabela ── */
.tabela-wrap{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:11px 12px;text-align:left;font-size:13px;border-bottom:1px solid #f0f0f0}
th{background:#f8f9fa;font-weight:600;color:#003366;white-space:nowrap}
tr:hover td{background:#f8f9fa}
tr.pref-row td{background:#fff5f5}
tr.pref-row:hover td{background:#ffe8e8}

/* ── Badge notificação ── */
.badge{background:#dc3545;color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;font-weight:700;margin-left:4px}

/* ── Dashboard dois colunas ── */
.dashboard-dois-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;margin-bottom:20px}

/* ── Eventos de Hoje ── */
.eventos-hoje-container{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.eventos-hoje-container h3{font-size:15px;color:#003366;margin-bottom:14px}
.eventos-hoje-lista{max-height:400px;overflow-y:auto}
.evento-hoje-card{background:#f8f9fa;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;border-left:4px solid #004d99;transition:background .2s}
.evento-hoje-card:hover{background:#e8f0fe}
.evento-hoje-card.prefeito{border-left-color:#dc3545;background:#fff5f5}
.evento-hoje-titulo{font-weight:700;margin-bottom:6px;color:#003366;font-size:14px}
.evento-hoje-card.prefeito .evento-hoje-titulo{color:#dc3545}
.evento-hoje-info{font-size:12px;color:#666;margin-bottom:2px}

/* ── Progress bar upload ── */
.progress-bar-container{width:100%;height:8px;background:#e0e0e0;border-radius:4px;margin-top:10px;overflow:hidden;display:none}
.progress-bar-fill{height:100%;background:#004d99;width:0%;transition:width .3s;border-radius:4px}

/* ── Mobile ── */
.menu-toggle{display:none;position:fixed;top:10px;left:10px;z-index:200;background:#003366;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.overlay.ativo{display:block}
.alerta-retroativo{font-size:12px;color:#dc3545;margin-top:4px;display:none}
.empty{text-align:center;padding:32px;color:#999;font-size:14px}
.btn{min-height:40px}
.form-group input,.form-group select,.form-group textarea{font-size:16px!important}

@media(max-width:768px){
  /* Layout */
  .sidebar{transform:translateX(-100%);width:260px}
  .sidebar.aberta{transform:translateX(0)}
  .main{margin-left:0;width:100%;padding:12px;padding-top:62px}
  .menu-toggle{display:flex;align-items:center;justify-content:center}

  /* Cards */
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:12px}
  .stat-icon{font-size:28px}
  .stat-info h3{font-size:20px}

  /* Seções e botões */
  .secao{padding:14px}
  .secao-header{flex-direction:column;align-items:flex-start}
  .secao-header .btns-row{width:100%}
  .btn{padding:10px 14px;font-size:13px}
  .btns-row{gap:8px;justify-content:center}
  .btns-row .btn{flex:1;text-align:center;justify-content:center}

  /* Formulários */
  [style*="grid-template-columns:1fr 1fr"]{display:block!important}
  [style*="grid-template-columns:1fr 1fr"]>.form-group{margin-bottom:12px}

  /* Tabela */
  table{min-width:600px}

  /* Modal — sobe da base da tela */
  .modal-bg{align-items:flex-end;padding:0}
  .modal-box{border-radius:16px 16px 0 0;max-height:95vh;margin-top:auto}
  .modal-footer{flex-direction:column}
  .modal-footer .btn{width:100%;justify-content:center}
  .info-linha{flex-direction:column}
  .info-label{width:100%;margin-bottom:2px}

  /* Dashboard grid vira 1 coluna */
  .dashboard-dois-col{grid-template-columns:1fr!important}

  /* Calendário mobile: zoom 70% → todas as 7 colunas visíveis */
  #calendario .secao{padding:0;border-radius:0;box-shadow:none;overflow:hidden}
  #cal{zoom:0.65;transform-origin:top left;overflow:hidden}
  .fc-view-harness{height:auto!important;min-height:280px!important}
  .fc-toolbar{flex-direction:column!important;gap:4px!important;align-items:center!important}
  .fc-toolbar-chunk{text-align:center!important}
  /* Hora na 1ª linha, título na 2ª — white-space:pre-line respeita \n */
  .fc-event{white-space:pre-line!important;overflow:hidden!important;line-height:1.3!important}
  .fc-event-title{display:block!important}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .login-card{padding:28px 18px}
  .sidebar-header h3{font-size:14px}
  .nav-item{font-size:13px;padding:10px 12px}
  .evento-titulo{font-size:14px}
  .evento-meta{font-size:12px}
  .secao-header h2{font-size:16px}
}
@media(max-width:360px){.stats-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>

<script>
const API_URL = localStorage.getItem('apiUrl') ||
  'https://script.google.com/macros/s/AKfycbyEMl_w3xkIGcLX-qo589iIf8tZTGMIweVVfsBAYCXvf6UyUgyosCkNUVUI1NSEUuHZ9w/exec';

let token    = localStorage.getItem('token');
let usuario  = JSON.parse(localStorage.getItem('usuario') || 'null');
let eventos  = [];
let todosEventos = [];
let calendar = null;
let _autoRefreshId = null;
let solicitacoesList = [];

async function api(action, data = {}) {
  try {
    const p = new URLSearchParams({ action, token: token || '', ...data });
    const res = await fetch(`${API_URL}?${p}`);
    const json = await res.json();
    if (json && json.error) throw new Error(json.error);
    return json;
  } catch (e) {
    if (e.message && e.message.includes('autorizado')) logout();
    throw e;
  }
}

async function apiPost(action, data = {}) {
  try {
    const url = `${API_URL}?action=${encodeURIComponent(action)}&token=${encodeURIComponent(token||'')}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ ...data, token: token || '' })
    });
    const json = await res.json();
    if (json && json.error) throw new Error(json.error);
    return json;
  } catch (e) {
    if (e.message && e.message.includes('autorizado')) logout();
    throw e;
  }
}

const fmtData = s => s ? new Date(s).toLocaleDateString('pt-BR') : '-';
const fmtHora = s => s ? new Date(s).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
const fmtDH   = s => s ? new Date(s).toLocaleString('pt-BR') : '-';
const isMobile = () => window.innerWidth <= 768;
// Normaliza string para busca sem distinção de acentos/ç
const normBusca = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const isPrefeito     = e => e.orgao === 'Gabinete do Prefeito';
const isSecom        = e => (e.sigla_orgao || sigla(e.orgao)) === 'SECOM';
const isUsuarioSecom = () => usuario && sigla(usuario.orgao) === 'SECOM';
const $ = id => document.getElementById(id);

const SIGLAS = {
  // Gabinete
  'Gabinete do Prefeito':'PREFEITO',
  'Chefia de Gabinete':'GABINETE',
  // Secretarias
  'Secretaria de Administração':'SECAD',
  'Secretaria de Agricultura e Abastecimento':'SEAGRI',
  'Secretaria de Assistência Social':'SAS',
  'Secretaria de Assuntos Jurídicos e Legislativos':'SEAJUR',
  'Secretaria de Comunicação':'SECOM',
  'Secretaria de Cultura':'SECULT',
  'Secretaria de Desenvolvimento Econômico':'SEDEPP',
  'Secretaria de Educação':'SEDUC',
  'Secretaria de Esporte':'SEMEPP',
  'Secretaria de Finanças':'SEFIN',
  'Secretaria de Meio Ambiente':'SEMEA',
  'Secretaria de Mobilidade Urbana e Cooperação em Segurança Pública':'SEMOB',
  'Secretaria de Obras e Serviços Públicos':'SOSP',
  'Secretaria de Planejamento, Desenvolvimento Urbano e Habitação':'SEPLAN',
  'Secretaria de Saúde':'SESAU',
  'Secretaria de Tecnologia da Informação':'SETEC',
  'Secretaria de Turismo':'SETUR',
  // Outras Unidades
  'Comissão Interna de Prevenção de Acidentes e Assédio':'CIPA',
  'Comitê Gestor da Praça CEU':'CGPCEU',
  'Controladoria Geral do Município':'CGM',
  'Controladoria-Geral do Município':'CGM',
  'Coordenadoria da Juventude':'JUVENTUDE',
  'Coordenadoria da Pessoa com Deficiência':'CPD',
  'Coordenadoria de Proteção e Defesa Civil':'COMPDEC',
  'Coordenadoria Municipal do Idoso':'IDOSOPP',
  'Instituto do Idoso de Presidente Prudente':'IDOSOPP',
  'Fundo Municipal de Defesa dos Interesses Difusos':'FMDID',
  'Fundo Social de Solidariedade de Presidente Prudente':'FUNDO',
  'Núcleo da Escola Federativa do Município de Presidente Prudente':'NEF',
  'Serviço Especializado em Engenharia de Segurança e em Medicina do Trabalho':'SESMT'
};

const ORGAOS_LIST = {
  'Gabinete':[
    'Gabinete do Prefeito',
    'Chefia de Gabinete'
  ],
  'Secretarias':[
    'Secretaria de Administração',
    'Secretaria de Agricultura e Abastecimento',
    'Secretaria de Assistência Social',
    'Secretaria de Assuntos Jurídicos e Legislativos',
    'Secretaria de Comunicação',
    'Secretaria de Cultura',
    'Secretaria de Desenvolvimento Econômico',
    'Secretaria de Educação',
    'Secretaria de Esporte',
    'Secretaria de Finanças',
    'Secretaria de Meio Ambiente',
    'Secretaria de Mobilidade Urbana e Cooperação em Segurança Pública',
    'Secretaria de Obras e Serviços Públicos',
    'Secretaria de Planejamento, Desenvolvimento Urbano e Habitação',
    'Secretaria de Saúde',
    'Secretaria de Tecnologia da Informação',
    'Secretaria de Turismo'
  ],
  'Outras Unidades':[
    'Comissão Interna de Prevenção de Acidentes e Assédio',
    'Comitê Gestor da Praça CEU',
    'Controladoria Geral do Município',
    'Coordenadoria da Juventude',
    'Coordenadoria da Pessoa com Deficiência',
    'Coordenadoria de Proteção e Defesa Civil',
    'Coordenadoria Municipal do Idoso',
    'Fundo Municipal de Defesa dos Interesses Difusos',
    'Fundo Social de Solidariedade de Presidente Prudente',
    'Núcleo da Escola Federativa do Município de Presidente Prudente',
    'Serviço Especializado em Engenharia de Segurança e em Medicina do Trabalho'
  ]
};

function orgaosSelectHtml(id, required=true) {
  return `<select id="${id}" ${required?'required':''}>
    <option value="">Selecione...</option>
    ${Object.entries(ORGAOS_LIST).map(([grupo,lista])=>
      `<optgroup label="${grupo}">${lista.map(o=>`<option>${o}</option>`).join('')}</optgroup>`
    ).join('')}
  </select>`;
}

const sigla = orgao => {
  if (!orgao) return '';
  const norm = orgao.normalize('NFC').trim();
  if (SIGLAS[norm]) return SIGLAS[norm];
  const lower = norm.toLowerCase();
  const found = Object.keys(SIGLAS).find(k => k.normalize('NFC').toLowerCase() === lower);
  if (found) return SIGLAS[found];
  return norm.substring(0,6).toUpperCase();
};

function evtDoUsuario() {
  return eventos; // backend already filters by orgao/tipo
}
function evtHoje() {
  const h = new Date(); h.setHours(0,0,0,0);
  return evtDoUsuario().filter(e => {
    const d = new Date(e.data_evento); d.setHours(0,0,0,0);
    return d.getTime() === h.getTime();
  }).sort((a,b) => new Date(a.data_evento)-new Date(b.data_evento));
}

async function render() {
  if (!token || !usuario) { $('root').innerHTML = htmlLogin(); return; }
  try {
    eventos = await api('getEventos');
    if (!Array.isArray(eventos)) eventos = [];
  } catch(e) { eventos = []; }

  if (usuario.tipo === 'orgao' && isUsuarioSecom()) {
    try { const r = await api('getEventos', {todos:'true'}); eventos = Array.isArray(r) ? r : []; } catch(e) {}
    todosEventos = [];
  } else if (usuario.tipo === 'orgao' && usuario.orgao !== 'Gabinete do Prefeito') {
    try { const r = await api('getEventos', {todos:'true'}); todosEventos = Array.isArray(r) ? r : []; } catch(e) { todosEventos = []; }
  } else {
    todosEventos = [];
  }

  calendar = null;
  if      (usuario.tipo === 'admin')    $('root').innerHTML = htmlAdmin();
  else if (usuario.tipo === 'prefeito') $('root').innerHTML = htmlPrefeito();
  else if (isUsuarioSecom())            $('root').innerHTML = htmlSecom();
  else                                  $('root').innerHTML = htmlSecretaria();

async function enviarSolicitacao(ev) {
  ev.preventDefault();
  const err=$('erroSolic'),ok=$('okSolic');
  err.style.display='none'; ok.style.display='none';
  const senha=$('sSenha').value, senhaConf=$('sSenhaConf').value;

    err.textContent='❌ As senhas não coincidem.'; err.style.display='block'; return;

  if (senha.length < 6) {
    err.textContent='❌ A senha deve ter pelo menos 6 caracteres.'; err.style.display='block'; return;
  }
  try {
    await api('solicitarAcesso',{
      nome:$('sNome').value, email:$('sEmail').value,
      login:$('sLogin').value, telefone:$('sTel').value,
      orgao:$('sOrgao').value,
      senha
    });
    ok.textContent='✅ Solicitação enviada! O administrador entrará em contato.';
    ok.style.display='block';
    $('formSolic').reset();

function evtTodosHoje() {
  const h = new Date(); h.setHours(0,0,0,0);
  return todosEventos.filter(e => {
    const d = new Date(e.data_evento); d.setHours(0,0,0,0);
    return d.getTime() === h.getTime();
  }).sort((a,b) => new Date(a.data_evento)-new Date(b.data_evento));
}

function iniciarAutoRefresh() {
  if (_autoRefreshId) { clearInterval(_autoRefreshId); _autoRefreshId = null; }
  const tipo = usuario?.tipo;
  if (tipo !== 'admin' && tipo !== 'orgao') return;
  _autoRefreshId = setInterval(async function() {
    if (isUsuarioSecom()) {
      try { const r = await api('getEventos',{todos:'true'}); if (Array.isArray(r)) eventos=r; } catch(e) { return; }
      const cs = $('secomEventosHoje');
      if (cs) { const hj=evtHoje(); cs.innerHTML=hj.length===0?'<div class="empty">Nenhum evento hoje</div>':hj.map(e=>cardEvento(e,true)).join(''); }
      if (calendar) { try { calendar.removeAllEvents(); calendar.addEventSource(eventosParaCalendario()); } catch(e) {} }
      return;
    }
    try { const r = await api('getEventos'); if (Array.isArray(r)) eventos=r; } catch(e) { return; }
    if (tipo === 'admin') {
      if (calendar) { try { calendar.removeAllEvents(); calendar.addEventSource(eventosParaCalendario()); } catch(e) {} }
      renderizarMetrica();
    } else {
      if (usuario.orgao !== 'Gabinete do Prefeito') {
        try { const r = await api('getEventos',{todos:'true'}); if (Array.isArray(r)) todosEventos=r; } catch(e) {}
      }
      const cont1 = $('orgaoEventosHoje');
      if (cont1) { const hj=evtHoje(); cont1.innerHTML=hj.length===0?'<div class="empty">Nenhum evento hoje</div>':hj.map(e=>cardEvento(e)).join(''); }
      const cont2 = $('todosEventosHoje');
      if (cont2) { const todos=evtTodosHoje(); cont2.innerHTML=todos.length===0?'<div class="empty">Nenhum evento hoje</div>':todos.map(e=>cardEventoResumo(e)).join(''); }
      if (calendar) { try { calendar.removeAllEvents(); calendar.addEventSource(eventosParaCalendario()); } catch(e) {} }
    }
  }, 60000);
}

// ════════════════ COMPONENTES ════════════════
function cardEvento(e, mostrarOrgao=false) {
  const pref=isPrefeito(e);
  const temAnexo=!!(e.anexo_url||e.anexo_nome);
  return `
  <div class="evento-card${pref?' prefeito':''}" onclick="verEvento('${e.id}')">
    <div class="evento-titulo">${e.titulo}
      ${pref?'<span class="tag-prefeito">🏛️ PREFEITO</span>':''}
      ${mostrarOrgao?`<span class="tag-orgao">${(e.sigla_orgao||sigla(e.orgao))}</span>`:''}
      ${temAnexo?'<span style="font-size:12px;margin-left:6px">📎</span>':''}
    </div>
    <div class="evento-meta">
      <span>📅 ${fmtData(e.data_evento)}</span>
      ${fmtHora(e.data_evento)?`<span>🕐 ${fmtHora(e.data_evento)}</span>`:''}
      ${e.local?`<span>📍 ${e.local}</span>`:''}
      ${e.responsavel?`<span>👤 ${e.responsavel}</span>`:''}
      ${usuario?.tipo==='admin'&&e.publicado_por?`<span style="color:#888;font-size:11px">✍️ ${e.publicado_por} · ${fmtDH(e.data_publicacao)}</span>`:''}
    </div>
  </div>`;
}

function renderListaEventos(lista) {
  if (!lista||!lista.length) return '<div class="empty">Nenhum evento encontrado</div>';
  return lista.sort((a,b)=>new Date(b.data_evento)-new Date(a.data_evento))
    .map(e=>cardEvento(e,usuario?.tipo==='admin'||usuario?.tipo==='prefeito')).join('');
}

function renderTabelaAdmin(lista) {
  if (!lista||!lista.length) return '<div class="empty">Nenhum evento encontrado</div>';
  const sorted=lista.slice().sort((a,b)=>new Date(b.data_evento)-new Date(a.data_evento));
  return `<div class="tabela-wrap"><table>
    <thead><tr><th>Órgão</th><th>Evento</th><th>Data/Hora</th><th>Publicado por</th><th>Publicado em</th><th>Anexo</th></tr></thead>
    <tbody>${sorted.map(e=>`
      <tr class="${isPrefeito(e)?'pref-row':''}" onclick="verEvento('${e.id}')" style="cursor:pointer">
        <td>${(e.sigla_orgao||sigla(e.orgao))||'—'}${isPrefeito(e)?'  ⭐':''}</td>
        <td>${e.titulo}</td>
        <td>${fmtData(e.data_evento)} ${fmtHora(e.data_evento)}</td>
        <td>${e.publicado_por||'—'}</td>
        <td style="font-size:11px">${fmtDH(e.data_publicacao)}</td>
        <td>${(e.anexo_url||e.anexo_nome)?'<span style="color:#004d99">📎</span>':'—'}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
}

// ════════════════ MÉTRICA DE USABILIDADE ════════════════
function calcularMetricaUsabilidade() {
  const totalOrgaos = Object.values(ORGAOS_LIST).reduce(function(acc, lista){ return acc + lista.length; }, 0);
  const contagem = {};
  eventos.forEach(function(e) { if (e.orgao) contagem[e.orgao] = (contagem[e.orgao] || 0) + 1; });
  const orgaosAtivos = Object.keys(contagem).length;
  const totalEventos = eventos.length;
  const media = orgaosAtivos > 0 ? (totalEventos / orgaosAtivos).toFixed(1) : '0';
  const taxaEngajamento = totalOrgaos > 0 ? Math.round((orgaosAtivos / totalOrgaos) * 100) : 0;
  const ranking = Object.entries(contagem)
    .sort(function(a,b){ return b[1]-a[1]; })
    .map(function(item){ return { orgao: item[0], qtd: item[1], siglaOrgao: sigla(item[0]) }; });
  return { media: media, taxaEngajamento: taxaEngajamento, ranking: ranking, orgaosAtivos: orgaosAtivos, totalOrgaos: totalOrgaos, totalEventos: totalEventos };
}

function renderizarMetrica() {
  const container = $('metricaContainer');
  if (!container) return;
  const m = calcularMetricaUsabilidade();
  const top5 = m.ranking.slice(0, 5);
  container.innerHTML = `
    <div class="secao">
      <div class="secao-header">
        <h2>📈 Métrica de Uso por Órgão</h2>
        ${m.ranking.length > 5 ? `<button class="btn btn-outline" onclick="abrirModalMetricaDetalhada()">Ver Ranking Completo</button>` : ''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px">
        <div style="background:#e8f4f8;border-radius:12px;padding:16px;text-align:center">
          <div style="font-size:28px;font-weight:700;color:#003366">${m.media}</div>
          <div style="font-size:12px;color:#555;margin-top:4px">Média Eventos/Órgão</div>
        </div>
        <div style="background:#e8f8ee;border-radius:12px;padding:16px;text-align:center">
          <div style="font-size:28px;font-weight:700;color:#28a745">${m.taxaEngajamento}%</div>
          <div style="font-size:12px;color:#555;margin-top:4px">Taxa de Engajamento</div>
        </div>
        <div style="background:#fff3cd;border-radius:12px;padding:16px;text-align:center">
          <div style="font-size:28px;font-weight:700;color:#856404">${m.orgaosAtivos}/${m.totalOrgaos}</div>
          <div style="font-size:12px;color:#555;margin-top:4px">Órgãos Publicando</div>
        </div>
      </div>
      ${top5.length === 0 ? '<div class="empty">Nenhum evento publicado ainda</div>' : `
      <div style="font-size:13px;font-weight:600;color:#003366;margin-bottom:10px">🏆 TOP 5 — Órgãos mais ativos</div>
      ${top5.map(function(item, i) {
        const pct = m.totalEventos > 0 ? Math.round((item.qtd / m.totalEventos) * 100) : 0;
        return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <div style="width:24px;height:24px;background:#003366;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">${i+1}</div>
          <div style="flex:1">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
              <span style="font-weight:600">${item.siglaOrgao}</span>
              <span style="color:#666">${item.qtd} evento${item.qtd!==1?'s':''} · ${pct}%</span>
            </div>
            <div style="background:#e9ecef;border-radius:4px;height:6px">
              <div style="background:#004d99;width:${pct}%;height:6px;border-radius:4px;transition:width .5s"></div>
            </div>
          </div>
        </div>`;
      }).join('')}`}
    </div>
  `;
}

function abrirModalMetricaDetalhada() {
  const m = calcularMetricaUsabilidade();
  const modalId = 'modalMetrica';
  let modal = $(modalId);
  if (!modal) {

    modal.id = modalId;
    modal.className = 'modal-bg';
    modal.onclick = function(ev) { if (ev.target === modal) fecharModal(modalId); };
    document.body.appendChild(modal);
  }
  function medalha(i) { return i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1); }
  modal.innerHTML = `
    <div class="modal-box" onclick="event.stopPropagation()" style="max-width:520px">
      <div class="modal-head">
        <h3>📈 Ranking Completo — Uso por Órgão</h3>

            <div style="font-size:11px;color:#555">Engajamento</div>

          <div style="background:#fff3cd;border-radius:10px;padding:12px;text-align:center">
            <div style="font-size:22px;font-weight:700;color:#856404">${m.totalEventos}</div>
            <div style="font-size:11px;color:#555">Total Eventos</div>
          </div>
        </div>
        <div style="font-size:13px;font-weight:600;color:#003366;margin-bottom:12px">📋 Ranking — ${m.ranking.length} órgão${m.ranking.length!==1?'s':''} com eventos</div>
        <div style="max-height:360px;overflow-y:auto">
          ${m.ranking.length === 0
            ? '<div class="empty">Nenhum evento publicado ainda</div>'
            : m.ranking.map(function(item, i) {
                const pct = m.totalEventos > 0 ? Math.round((item.qtd / m.totalEventos) * 100) : 0;
                return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f0f0f0">
                  <div style="width:32px;text-align:center;font-size:${i<3?'18':'13'}px;font-weight:700;flex-shrink:0">${medalha(i)}</div>
                  <div style="flex:1">
                    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
                      <span style="font-weight:600">${item.siglaOrgao}</span>

                    </div>
                    <div style="background:#e9ecef;border-radius:4px;height:6px">

                    </div>

                </div>`;
              }).join('')}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cinza" onclick="fecharModal('${modalId}')">Fechar</button>
      </div>

function inicializarApp() {
  if (usuario?.tipo==='admin') {
    carregarUsuarios();
    carregarSolicitacoes();
    setTimeout(renderizarMetrica, 200);
  }
}

function mostrarView(id) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el=$(id); if(el) el.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>{
    n.classList.toggle('active', n.getAttribute('onclick')?.includes(`'${id}'`));
  });

  // Calendário: zera padding do .main para o FC receber 100% da largura
  const main = document.querySelector('.main');
  if (main && isMobile()) {
    if (id === 'calendario') {
      main.style.paddingLeft  = '0';
      main.style.paddingRight = '0';
      // Sempre destrói e recria no mobile — garante medição correta do container
      if (calendar) { try { calendar.destroy(); } catch(e) {} calendar = null; }
    } else {
      main.style.paddingLeft  = '';
      main.style.paddingRight = '';
    }
  }

  if (id==='calendario') {
    // Double requestAnimationFrame: espera o navegador aplicar o CSS e reflowou
    // antes do FullCalendar medir offsetWidth do container
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (!calendar) iniciarCalendario();
      else { try { calendar.updateSize(); } catch(e) { calendar=null; iniciarCalendario(); } }
    }));
  }
  if (id==='dashboard' && usuario?.tipo==='admin') {
    setTimeout(renderizarMetrica, 100);
  }
  fecharMenuMobile();
}

  $('sidebar').classList.toggle('aberta');

function fecharMenuMobile() {

    normBusca((e.sigla_orgao||sigla(e.orgao))).includes(t)||normBusca(e.observacao).includes(t)):base;

async function criarEvento(ev) {
  ev.preventDefault();
  const dataVal=$('evtData').value;
  if(dataVal){
    if(new Date(dataVal)<new Date()){alert('❌ Não é permitido criar eventos com data ou hora retroativa.');return;}
  }
  const fileInput=$('evtAnexo');
  let arquivo_base64='',arquivo_nome='',arquivo_tipo='';
  if(fileInput&&fileInput.files&&fileInput.files[0]){
    const f=fileInput.files[0];
    if(f.size>10*1024*1024){alert('❌ Arquivo muito grande. Máximo 10MB.');return;}
    arquivo_nome=f.name; arquivo_tipo=f.type;
    const prog=$('progressUpload'),fill=$('progressFill');
    if(prog){prog.style.display='block';if(fill)fill.style.width='30%';}
    arquivo_base64=await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=e=>{if(fill)fill.style.width='80%';res(e.target.result.split(',')[1]);};
      r.onerror=rej; r.readAsDataURL(f);
    });
    if(fill)fill.style.width='100%';
    setTimeout(()=>{if(prog)prog.style.display='none';if(fill)fill.style.width='0%';},500);
  }
  try {
    const payload={titulo:$('evtTitulo').value,data_evento:dataVal,
      local:$('evtLocal')?.value||'',responsavel:$('evtResp')?.value||'',
      telefone:$('evtTel')?.value||'',observacao:$('evtObs').value,
      arquivo_base64,arquivo_nome,arquivo_tipo};
    if(arquivo_base64) await apiPost('criarEvento',payload);
    else await api('criarEvento',payload);
    ev.target.reset(); if($('nomeAnexo'))$('nomeAnexo').textContent='';
    await recarregarEventos();
    alert('✅ Evento criado com sucesso!');
    mostrarView(usuario?.tipo==='prefeito'?'agendaPref':'meusEventos');
  } catch(e){ alert('❌ '+e.message); }
}

async function recarregarEventos() {
  try { const r=await api('getEventos'); if(Array.isArray(r)) eventos=r; } catch(e){}
  const cont=$('listaEvtConteudo');
  if(cont){
    if(usuario?.tipo==='admin') cont.innerHTML=renderTabelaAdmin(eventos);
    else cont.innerHTML=renderListaEventos(usuario?.tipo==='prefeito'?eventos:evtDoUsuario());
  }
  if(calendar){
    try{ calendar.removeAllEvents(); calendar.addEventSource(eventosParaCalendario()); }
    catch(e){ calendar=null; }
  }
  if(usuario?.tipo==='admin') renderizarMetrica();
}

function eventosParaCalendario() {
  return evtDoUsuario().map(e=>({
    id:String(e.id),
    title:isMobile()
      ?(usuario?.tipo==='admin'||usuario?.tipo==='prefeito'
          ?`${fmtHora(e.data_evento)}\n${e.sigla_orgao||sigla(e.orgao)}`
          :`${fmtHora(e.data_evento)}\n${e.titulo}`)
      :(usuario?.tipo==='admin'||usuario?.tipo==='prefeito'
          ?`${e.sigla_orgao||sigla(e.orgao)}: ${e.titulo}`
          :e.titulo),
    start:e.data_evento,
    className:isPrefeito(e)?(isMobile()?'prefeito-event-mobile':'prefeito-event'):'',
    extendedProps:{eventoId:e.id}
  }));
}

function iniciarCalendario() {
  const el=$('cal'); if(!el) return;
  if (isMobile()) {
    const main=document.querySelector('.main');
    if(main){ main.style.paddingLeft='0'; main.style.paddingRight='0'; }
    // O CSS aplica zoom:0.7 em #cal, então a largura de render deve ser
    // vw / 0.7 para que após o zoom o visual ocupe exatamente a tela inteira
    const vw = window.innerWidth;
    el.style.width    = Math.ceil(vw / 0.65) + 'px';
    el.style.maxWidth = 'none';
    el.style.overflowX = 'hidden';
  } else {
    el.style.width = el.style.maxWidth = el.style.overflowX = '';
  }
  calendar=new FullCalendar.Calendar(el,{
    locale:'pt-br', initialView:'dayGridMonth',
    headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,dayGridWeek,listMonth'},
    buttonText:{today:'Hoje',month:'Mês',week:'Semana',list:'Lista'},
    noEventsText:'Nenhum evento para exibir',
    events:eventosParaCalendario(),
    eventClick:info=>verEvento(info.event.extendedProps.eventoId),
    dateClick:info=>{
      const lista=evtDoUsuario().filter(e=>{
        const de=new Date(e.data_evento); de.setHours(0,0,0,0);
        return de.getTime()===new Date(info.dateStr).getTime();
      }).sort((a,b)=>new Date(a.data_evento)-new Date(b.data_evento));
      if(lista.length) abrirModalEventosDoDia(info.dateStr, lista);
    },
    height:'auto'
  });
  calendar.render();
  if (isMobile()) {
    // Garante que o FC recalcula com a largura correta após o render
    requestAnimationFrame(() => calendar.updateSize());
  }
}

function abrirModalEventosDoDia(dataStr, lista) {
  const d=new Date(dataStr+'T00:00:00');
  const titulo=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  $('modalDiaTitulo').textContent=`📅 ${titulo}`;

      <div style="font-size:12px;color:#666">⏰ ${fmtHora(e.data_evento)}</div>
      ${e.orgao?`<div style="font-size:12px;color:#666">🏢 ${(e.sigla_orgao||sigla(e.orgao))}</div>`:''}
      ${e.local?`<div style="font-size:12px;color:#666">📍 ${e.local}</div>`:''}

  abrirModal('modalDia');

async function exportarPDF() {
  const el=$('dashboard');
  if(!el){alert('❌ Abra o Dashboard antes de exportar.');return;}
  try {
    alert('📄 Gerando PDF... Aguarde.');
    const canvas=await html2canvas(el,{scale:1.5,useCORS:true,logging:false});
    const imgData=canvas.toDataURL('image/png');
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const imgW=210,imgH=(canvas.height*imgW)/canvas.width;
    let y=0;
    const pageH=297;
    while(y<imgH){
      if(y>0) pdf.addPage();
      pdf.addImage(imgData,'PNG',0,-y,imgW,imgH);
      y+=pageH;
    }
    pdf.save(`dashboard_${new Date().toISOString().split('T')[0]}.pdf`);
  } catch(e){alert('❌ Erro ao gerar PDF: '+e.message);}
}

          <td>${s.nome||'—'}</td><td>${s.login}</td><td>${s.email}</td>
          <td>${sigla(s.orgao)||'—'}</td>
          <td>${s.tipoSolicitacao==='recuperacao'?'🔑 Recuperar Senha':'👤 Novo Acesso'}</td>
          <td style="font-size:11px">${fmtDH(s.data_solicitacao)}</td>
          <td><span style="color:${s.status==='pendente'?'#e67e00':'#28a745'};font-weight:600">${s.status}</span></td>
          <td>${s.status==='pendente'?`<div class="btns-row">
            ${s.tipoSolicitacao==='recuperacao'
              ?`<button class="btn btn-amarelo" onclick="resetarSenhaSolicitacao('${s.id}','${s.login}')">🔑 Resetar</button>`
              :`<button class="btn btn-verde" onclick="aprovarSolicitacao('${s.id}')">✅ Aprovar</button>`}
            <button class="btn btn-vermelho" onclick="rejeitarSolicitacao('${s.id}')">❌</button>
          </div>`:'—'}</td>
        </tr>`).join('')}
      </tbody></table></div>`;
  } catch(e){cont.innerHTML='<div class="empty">Erro: '+e.message+'</div>';}
}

async function aprovarSolicitacao(id) {
  const s=solicitacoesList.find(x=>String(x.id)===String(id)); if(!s) return;
  if(!confirm(`Aprovar solicitação de "${s.nome}" (${s.login}) para ${s.orgao||'—'}?`)) return;
  // Usa a senha escolhida pelo usuário na solicitação; fallback para padrão
  const senha = s.senha || (s.login + '@PP');
  const senhaGerada = !s.senha;
  try {
    await api('criarUsuario',{login:s.login,nome:s.nome,email:s.email,senha,tipo:'orgao',orgao:s.orgao});
    await api('atualizarSolicitacao',{id,status:'aprovado'});
    await carregarSolicitacoes(); await carregarUsuarios();
    alert(senhaGerada
      ? `✅ Usuário "${s.nome}" aprovado!\n\nSenha gerada automaticamente: ${senha}\nComunique ao usuário para alterar.`
      : `✅ Usuário "${s.nome}" aprovado!\n\nO usuário já definiu sua própria senha.`);
  } catch(e){alert('❌ '+e.message);}
}

async function resetarSenhaSolicitacao(id, login) {
  const nova=prompt(`Nova senha para "${login}":`); if(!nova) return;
  try {
    const lista=await api('getUsuarios');
    const user=lista.find(u=>u.login===login||u.email===login);
    if(!user){alert('Usuário não encontrado na base.');return;}
    await api('resetarSenha',{usuarioId:user.id,novaSenha:nova});
    await api('atualizarSolicitacao',{id,status:'resolvido'});
    await carregarSolicitacoes(); alert('✅ Senha redefinida!');
  } catch(e){alert('❌ '+e.message);}
}

async function rejeitarSolicitacao(id) {
  if(!confirm('Rejeitar esta solicitação?')) return;
  try {
    await api('atualizarSolicitacao',{id,status:'rejeitado'});
    await carregarSolicitacoes(); alert('✅ Solicitação rejeitada.');
  } catch(e){alert('❌ '+e.message);}
}

// ════════════════ MODAIS / UTILITÁRIOS ════════════════
function abrirModal(id){const el=$(id);if(el)el.classList.add('aberto');}
function fecharModal(id){const el=$(id);if(el)el.classList.remove('aberto');}

function exportarExcel() {
  const dados=evtDoUsuario().map(e=>({'Título':e.titulo,'Data':fmtDH(e.data_evento),'Local':e.local,
    'Órgão':(e.sigla_orgao||sigla(e.orgao)),'Responsável':e.responsavel,'Telefone':e.telefone,'Descrição':e.observacao,'Publicado por':e.publicado_por}));
  const ws=XLSX.utils.json_to_sheet(dados),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Eventos');
  XLSX.writeFile(wb,'agenda-prefeitura.xlsx');
}

let _lastMobile = isMobile();
window.addEventListener('resize', () => {
  if (!calendar) return;
  const nowMobile = isMobile();
  // Ao girar o celular, reaplica largura exata e recalcula
  if (nowMobile) {
    const el = $('cal');
    if (el) {
      el.style.width    = Math.ceil(window.innerWidth / 0.7) + 'px';
      el.style.maxWidth = 'none';
    }
  }
  if (nowMobile !== _lastMobile) {
    _lastMobile = nowMobile;
    calendar.removeAllEvents();
    calendar.addEventSource(eventosParaCalendario());
  }
  calendar.updateSize();
});

window.abrirModalMetricaDetalhada = abrirModalMetricaDetalhada;
window.fecharModal = fecharModal;

render();
</script>
